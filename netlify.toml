# LEXI Space на Netlify.
# Сайт — статический (папка site), данные спутников, астероидов и космической погоды
# идут через функции netlify/functions и подписываются ML-DSA-65.
#
# Переменные окружения (Site configuration → Environment variables):
#   LEXI_PQ_SEED  — секретное зерно ключа подписи (создаётся командой npm run keys, лежит в .env)
#   NASA_API_KEY  — ключ api.nasa.gov (необязательно, без него — DEMO_KEY с лимитом)

[build]
  publish = "site"
  functions = "netlify/functions"
  command = "npm run db && node scripts/fetch-model.mjs"

[functions]
  node_bundler = "esbuild"

# Изоляция страницы: нужна, чтобы нейросеть LexiAI работала в несколько потоков
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
